name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            artifact: Resonance-macos-arm64
          - os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            artifact: Resonance-linux-x64
          - os: windows-2022
            rust-target: x86_64-pc-windows-msvc
            artifact: Resonance-win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests (skip embedding-heavy tests in CI)
        run: npx vitest run --exclude '**/embedding.test.ts' --exclude '**/integration.test.ts' --exclude '**/hnsw*'

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/app
          tauriScript: npx tauri
          args: --target ${{ matrix.rust-target }}

      - name: Find build output
        id: output
        shell: bash
        run: |
          BUNDLE_DIR="packages/app/src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          echo "bundle_dir=$BUNDLE_DIR" >> "$GITHUB_OUTPUT"
          ls -lhR "$BUNDLE_DIR" || true

      - name: Verify macOS app signature and disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="packages/app/src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          shopt -s nullglob
          dmgs=( "$BUNDLE_DIR"/dmg/*.dmg )
          test "${#dmgs[@]}" -gt 0
          mount_dir=""
          backend_pid=""
          smoke_dir=""
          cleanup() {
            if [[ -n "$backend_pid" ]]; then
              kill "$backend_pid" >/dev/null 2>&1 || true
              wait "$backend_pid" >/dev/null 2>&1 || true
            fi
            if [[ -n "$mount_dir" ]]; then
              hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
              rmdir "$mount_dir" 2>/dev/null || true
            fi
            if [[ -n "$smoke_dir" ]]; then
              rm -rf "$smoke_dir"
            fi
          }
          trap cleanup EXIT
          for dmg in "${dmgs[@]}"; do
            hdiutil verify "$dmg"
            mount_dir="$(mktemp -d)"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
            app_path="$mount_dir/Resonance.app"
            test -d "$app_path"
            codesign --verify --deep --strict --verbose=2 "$app_path"
            codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q 'Sealed Resources version=2'
            node_path="$app_path/Contents/MacOS/node"
            server_dir="$app_path/Contents/Resources/server"
            test -f "$server_dir/server.mjs"
            test -f "$server_dir/node_modules/tweetnacl/package.json"
            test -f "$server_dir/node_modules/hnswlib-node/build/Release/addon.node"
            "$node_path" -e 'if (1 + 1 !== 2) process.exit(1)'

            smoke_dir="$(mktemp -d)"
            mkdir "$smoke_dir/home"
            env HOME="$smoke_dir/home" RESONANCE_PORT=0 \
              NODE_PATH="$server_dir/node_modules" \
              "$node_path" "$server_dir/server.mjs" >"$smoke_dir/backend.log" 2>&1 &
            backend_pid=$!
            ready_port=""
            for attempt in {1..60}; do
              ready_port="$(sed -n 's/^RESONANCE_READY:\([0-9][0-9]*\)$/\1/p' "$smoke_dir/backend.log" | head -1)"
              if [[ -n "$ready_port" ]]; then break; fi
              if ! kill -0 "$backend_pid" 2>/dev/null; then break; fi
              sleep 0.5
            done
            if [[ -z "$ready_port" ]] || ! curl --max-time 3 -fsS "http://127.0.0.1:$ready_port/api/status" | grep -q '"initialized"'; then
              cat "$smoke_dir/backend.log"
              exit 1
            fi
            kill "$backend_pid" >/dev/null 2>&1 || true
            wait "$backend_pid" >/dev/null 2>&1 || true
            backend_pid=""
            rm -rf "$smoke_dir"
            smoke_dir=""
            hdiutil detach "$mount_dir"
            rmdir "$mount_dir"
            mount_dir=""
          done

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/app/src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg

      - name: Upload Linux deb + rpm
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            packages/app/src-tauri/target/${{ matrix.rust-target }}/release/bundle/deb/*.deb
            packages/app/src-tauri/target/${{ matrix.rust-target }}/release/bundle/rpm/*.rpm

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            packages/app/src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
