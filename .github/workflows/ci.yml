name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Check development PRs as well as PRs targeting main.

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  local-ownership:
    # Filesystem/process compatibility checks only; no native application build.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies without native install scripts
        run: npm ci --ignore-scripts
      - name: Verify native signatures, local ownership and encrypted state
        run: npx vitest run --maxWorkers=1 packages/core/src/__tests__/ed25519-vectors.test.ts packages/core/src/__tests__/crypto.test.ts packages/core/src/__tests__/identity-encryption.test.ts packages/core/src/__tests__/local-state-owner.test.ts packages/core/src/__tests__/storage-reservations.test.ts packages/node/src/__tests__/encrypted-local-state.test.ts packages/node/src/__tests__/identity.test.ts packages/node/src/__tests__/identity-file.test.ts packages/node/src/__tests__/identity-file-crash.integration.test.ts
      - name: Verify IPv4 and IPv6 TLS paths, renewal and proxy forwarding
        run: npx vitest run --maxWorkers=1 packages/relay/src/__tests__/relay-tls-identity.test.ts packages/relay/src/__tests__/tls-paths.integration.test.ts
      - name: Verify infrastructure key migration and process interruption
        run: npx vitest run --maxWorkers=1 packages/relay/src/__tests__/relay-identity-store.test.ts packages/relay/src/__tests__/relay-identity-crash.integration.test.ts
      - name: Verify protected histories, policy observers and interruption
        run: >-
          npx vitest run --maxWorkers=1
          packages/core/src/__tests__/local-encrypted-state-encoding.test.ts
          packages/relay/src/__tests__/operator-json-encoding.test.ts
          packages/core/src/__tests__/admission-policy-freshness.test.ts
          packages/core/src/__tests__/policy-freshness-model.test.ts
          packages/relay/src/__tests__/admission-policy-observer.test.ts
          packages/relay/src/__tests__/admission-policy-observer-crash.integration.test.ts
          packages/relay/src/__tests__/admission-policy-observation.integration.test.ts
          packages/relay/src/__tests__/history-current-head.integration.test.ts
          packages/relay/src/__tests__/protected-policy-observer.integration.test.ts
          packages/relay/src/__tests__/protected-policy-quorum.integration.test.ts
          packages/relay/src/__tests__/policy-observer-history-restore.integration.test.ts
          packages/relay/src/__tests__/policy-observer-restore-crash.integration.test.ts
          packages/relay/src/__tests__/policy-observer-recovery.integration.test.ts
          packages/relay/src/__tests__/policy-observer-recovery-crash.integration.test.ts
          packages/relay/src/__tests__/policy-observer-config.integration.test.ts
          packages/relay/src/__tests__/policy-observer-recovery-command.integration.test.ts
          packages/relay/src/__tests__/policy-observer-setup.integration.test.ts
          packages/relay/src/__tests__/policy-observer-setup-crash.integration.test.ts
          packages/relay/src/__tests__/policy-observer-outbound.integration.test.ts
          packages/relay/src/__tests__/policy-observer-runtime.integration.test.ts
          packages/relay/src/__tests__/history-owner-routing.test.ts
          packages/relay/src/__tests__/history-local-exchange.test.ts
          packages/relay/src/__tests__/history-volunteer-collection.test.ts
          packages/relay/src/__tests__/history-volunteer-collection.integration.test.ts

  desktop-boundaries:
    # Actual local API/process checks; no native compilation or app installers.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies without native install scripts
        run: npm ci --ignore-scripts
      - name: Verify desktop imports, retained selections and HTTP boundaries
        run: >-
          npx vitest run --maxWorkers=1
          packages/app/src/server/__tests__/history-collection-storage.test.ts
          packages/app/src/server/__tests__/history-collection-activation.integration.test.ts
          packages/app/src/server/__tests__/local-api-lifetime.test.ts
          packages/app/src/server/__tests__/local-http-boundary.integration.test.ts
          packages/app/src/server/__tests__/native-import-boundary.integration.test.ts
          packages/app/src/server/__tests__/policy-observer-activation.integration.test.ts
          packages/app/src/server/__tests__/relay-loader-path.test.ts

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build all TypeScript projects
        run: npm run build

      - name: Run tests
        run: npx vitest run --maxWorkers=1

      - name: Run eval suite (quick)
        run: npm run eval:quick
