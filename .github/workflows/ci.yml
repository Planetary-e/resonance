name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Check development PRs as well as PRs targeting main.

jobs:
  local-ownership:
    # Filesystem/process compatibility checks only; no native application build.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies without native install scripts
        run: npm ci --ignore-scripts
      - name: Verify local ownership and encrypted state
        run: npx vitest run --maxWorkers=1 packages/core/src/__tests__/local-state-owner.test.ts packages/core/src/__tests__/storage-reservations.test.ts packages/node/src/__tests__/encrypted-local-state.test.ts

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build all TypeScript projects
        run: npm run build

      - name: Run tests
        run: npx vitest run --maxWorkers=1

      - name: Run eval suite (quick)
        run: npm run eval:quick
